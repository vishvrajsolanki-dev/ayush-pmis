name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: ./backend
      run: |
        # The backend has not been implemented yet, so it has no test files to
        # collect. Keep this CI step informative without failing solely on
        # pytest's exit code 5; real test failures remain blocking.
        pytest || {
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No backend tests collected; this is expected until backend code exists."
            exit 0
          fi
          exit "$status"
        }
